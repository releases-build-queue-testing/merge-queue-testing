agents:
  queue: local

steps:
  - label: ":test_tube: Test"
    key: test
    command: node --test app/

  - label: ":package: Build"
    key: build
    depends_on: test
    command: scripts/build.sh
    artifact_paths: "dist/*.tgz"

  - label: ":rocket: Release to dev"
    depends_on: build
    if: build.branch == pipeline.default_branch
    command: scripts/trigger-deploy.sh
